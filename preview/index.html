<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SnapTask Preview (V2 - Locket Photo Widget & High Contrast)</title>
  <style>
    :root {
      --obsidian: #151311;
      --velvet: #4B262F;
      --velvet-light: #6B3843;
      --almond: #EED3BA;
      --text-white: #FFFDF9;
      --text-cream: #EBDBCF;
      --text-muted: #BFAAA0;
      --chip-bg: #381F26;
      --chip-border: #633A44;
      --surface-elevated: #241B1F;
      --danger: #EF4444;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0A0808; color: var(--text-white); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

    /* Phone Shell Simulator */
    .phone-container {
      width: 390px;
      height: 810px;
      background: linear-gradient(180deg, #151311 0%, #4B262F 55%, #2C161D 100%);
      border-radius: 46px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.7), 0 0 0 12px #221F1C;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Status Bar */
    .status-bar {
      height: 44px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-white);
    }

    /* Smart Header */
    .app-header {
      padding: 10px 20px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .app-title h1 { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; color: var(--text-white); }
    .app-title p { font-size: 13px; color: var(--text-cream); margin-top: 2px; font-weight: 500; }
    .smart-tools { display: flex; gap: 8px; align-items: center; }
    .icon-pill-btn {
      height: 38px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--chip-border);
      background: var(--chip-bg); display: flex; align-items: center; gap: 6px;
      cursor: pointer; font-size: 12px; font-weight: 700; color: var(--text-white);
    }

    /* Tags Scroll */
    .tags-row {
      display: flex; gap: 8px; padding: 0 20px 14px; overflow-x: auto; scrollbar-width: none;
    }
    .tags-row::-webkit-scrollbar { display: none; }
    .tag-chip {
      padding: 8px 16px; border-radius: 12px; font-size: 12px; font-weight: 700;
      background: var(--chip-bg); color: var(--text-white); white-space: nowrap; cursor: pointer;
      border: 1px solid var(--chip-border); transition: all 0.15s ease;
    }
    .tag-chip.active { background: var(--almond); color: var(--obsidian); border-color: var(--almond); }

    /* Main Scroll Area */
    .content-area {
      flex: 1; overflow-y: auto; padding: 0 20px 100px;
    }

    /* TRUE LOCKET WIDGET PREVIEW */
    .locket-widget-box {
      width: 100%; aspect-ratio: 1.15; border-radius: 24px; overflow: hidden;
      position: relative; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 2px solid rgba(238, 211, 186, 0.4);
    }
    .locket-widget-bg-img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .locket-widget-top {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .locket-top-pill {
      background: rgba(21, 19, 17, 0.75); backdrop-filter: blur(8px);
      padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 800;
      color: var(--almond); letter-spacing: 0.5px;
    }
    .locket-priority-pill {
      background: var(--danger); color: #FFF; font-size: 9px; font-weight: 800;
      padding: 3px 8px; border-radius: 8px;
    }
    .locket-widget-bottom-scrim {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(21, 19, 17, 0.85); backdrop-filter: blur(10px);
      padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .locket-task-title {
      font-size: 14px; font-weight: 800; color: #FFF; line-height: 1.2;
    }
    .locket-done-btn {
      width: 100%; padding: 8px 12px; border-radius: 10px; border: none;
      background: var(--almond); color: var(--obsidian); font-weight: 800; font-size: 13px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    }

    /* Grid Layout */
    .snap-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    }
    .snap-card {
      background: var(--surface-elevated); border: 1px solid var(--chip-border);
      border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column;
      cursor: pointer; transition: transform 0.15s ease;
    }
    .snap-card:active { transform: scale(0.97); }
    .snap-img-box {
      width: 100%; aspect-ratio: 1.05; background: var(--velvet); position: relative; overflow: hidden;
    }
    .snap-img-box img { width: 100%; height: 100%; object-fit: cover; }
    .card-badge {
      position: absolute; top: 8px; left: 8px; padding: 4px 8px; border-radius: 8px;
      font-size: 10px; font-weight: 800; color: #FFF;
    }
    .card-body {
      padding: 12px; display: flex; flex-direction: column; gap: 6px;
    }
    .card-title-row { display: flex; align-items: flex-start; gap: 8px; }
    .check-circle {
      width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--almond);
      cursor: pointer; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center;
    }
    .check-circle.done { background: #22C55E; border-color: #22C55E; color: #FFF; font-size: 12px; }
    .card-title {
      font-size: 14px; font-weight: 700; line-height: 1.3; color: var(--text-white);
    }
    .card-title.done { text-decoration: line-through; color: var(--text-muted); }

    /* Locket Shutter Floating Action Bar */
    .floating-bar {
      position: absolute; bottom: 20px; left: 0; right: 0; display: flex;
      justify-content: center; align-items: center; pointer-events: none;
    }
    .shutter-btn {
      width: 70px; height: 70px; border-radius: 50%; background: var(--almond);
      border: 4px solid var(--velvet); box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      color: var(--obsidian); font-size: 28px; pointer-events: auto; transition: transform 0.1s ease;
    }
    .shutter-btn:active { transform: scale(0.92); }

    /* Modal Sheet */
    .modal-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: none;
      align-items: flex-end; z-index: 100; backdrop-filter: blur(6px);
    }
    .modal-overlay.open { display: flex; }
    .modal-sheet {
      background: #1E1719; width: 100%; border-radius: 28px 28px 0 0;
      padding: 24px; display: flex; flex-direction: column; gap: 16px;
      border-top: 2px solid var(--chip-border); animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-title { font-size: 20px; font-weight: 800; color: var(--text-white); }
    .sheet-input {
      width: 100%; padding: 14px; border: 1.5.dp solid var(--chip-border);
      border-radius: 14px; font-size: 14px; outline: none; background: #281C21;
      color: var(--text-white);
    }
    .sheet-row { display: flex; gap: 10px; }
    .sheet-btn {
      flex: 1; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 800;
      border: none; cursor: pointer; background: var(--almond); color: var(--obsidian);
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <!-- Status Bar -->
    <div class="status-bar">
      <span>01:26</span>
      <span>📶 5G  🔋 95%</span>
    </div>

    <!-- Smart Header -->
    <div class="app-header">
      <div class="app-title">
        <h1>SnapTask</h1>
        <p id="taskCountText">1 việc cần giải quyết</p>
      </div>
      <div class="smart-tools">
        <button class="icon-pill-btn" onclick="toggleView()" id="viewToggleBtn">
          <span>☷</span>
          <span>Bảng Cột</span>
        </button>
      </div>
    </div>

    <!-- Tags Row -->
    <div class="tags-row" id="tagsContainer">
      <div class="tag-chip active" onclick="filterTag('ALL')">Tất cả</div>
      <div class="tag-chip" onclick="filterTag('WORK')">Công việc</div>
      <div class="tag-chip" onclick="filterTag('PERSONAL')">Cá nhân</div>
      <div class="tag-chip" onclick="filterTag('SHOPPING')">Mua sắm</div>
      <div class="tag-chip" onclick="filterTag('HOME')">Nhà cửa</div>
    </div>

    <!-- Content Area -->
    <div class="content-area">
      <!-- TRUE LOCKET PHOTO WIDGET PREVIEW -->
      <div style="font-size: 11px; font-weight: 800; color: var(--text-cream); margin-bottom: 8px; letter-spacing: 0.5px;">
        MÔ PHỎNG WIDGET MÀN HÌNH CHÍNH (CÓ ẢNH NHƯ LOCKET):
      </div>
      <div class="locket-widget-box" id="widgetBox">
        <img id="widgetImg" class="locket-widget-bg-img" src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400">
        
        <div class="locket-widget-top">
          <div class="locket-top-pill">VIỆC CẦN LÀM</div>
          <div class="locket-priority-pill" id="widgetPriority">GẤP</div>
        </div>

        <div class="locket-widget-bottom-scrim">
          <div class="locket-task-title" id="widgetTitle">Đọc 20 trang sách Thiết kế hệ thống</div>
          <button class="locket-done-btn" onclick="completeTopWidgetTask()">✓ Xong ngay</button>
        </div>
      </div>

      <!-- Snap Grid -->
      <div class="snap-grid" id="snapGrid"></div>
    </div>

    <!-- Floating Action Shutter (Locket camera trigger) -->
    <div class="floating-bar">
      <button class="shutter-btn" onclick="openCaptureModal()" title="Chụp việc cần làm">📸</button>
    </div>

    <!-- Quick Snap Modal Sheet -->
    <div class="modal-overlay" id="captureModal">
      <div class="modal-sheet">
        <div class="sheet-title">Tạo việc cần làm mới</div>
        <input type="text" id="taskInput" class="sheet-input" placeholder="Bạn cần làm gì với ảnh này?" autofocus>
        
        <div style="font-size: 13px; font-weight: 700; color: var(--text-cream);">Danh mục:</div>
        <div class="tags-row" style="padding: 0;">
          <div class="tag-chip active" id="modalTagWork" onclick="selectModalTag('WORK')">Công việc</div>
          <div class="tag-chip" id="modalTagPersonal" onclick="selectModalTag('PERSONAL')">Cá nhân</div>
          <div class="tag-chip" id="modalTagShopping" onclick="selectModalTag('SHOPPING')">Mua sắm</div>
        </div>

        <div class="sheet-row">
          <button class="sheet-btn" style="background: var(--chip-bg); color: var(--text-white);" onclick="closeCaptureModal()">Hủy</button>
          <button class="sheet-btn" onclick="saveNewTask()">Lưu & Ghim Widget</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const sampleTasks = [
      {
        id: 1,
        title: "First Build - Chụp thử ứng dụng",
        img: "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=400",
        tag: "WORK",
        tagName: "Công việc",
        tagColor: "#2563EB",
        priority: "HIGH",
        status: "TODO"
      },
      {
        id: 2,
        title: "Mua sữa hạt & trứng gà",
        img: "https://images.unsplash.com/photo-1583258292688-d0213dc5a3a8?w=400",
        tag: "SHOPPING",
        tagName: "Mua sắm",
        tagColor: "#D97706",
        priority: "MEDIUM",
        status: "TODO"
      }
    ];

    let currentTasks = [...sampleTasks];
    let activeTag = 'ALL';
    let currentModalTag = 'WORK';

    function renderTasks() {
      const grid = document.getElementById('snapGrid');
      grid.innerHTML = '';

      const filtered = activeTag === 'ALL' ? currentTasks : currentTasks.filter(t => t.tag === activeTag);
      const pendingCount = currentTasks.filter(t => t.status !== 'DONE').length;
      document.getElementById('taskCountText').innerText = `${pendingCount} việc cần giải quyết`;

      filtered.forEach(task => {
        const isDone = task.status === 'DONE';
        const card = document.createElement('div');
        card.className = 'snap-card';
        card.innerHTML = `
          <div class="snap-img-box">
            <img src="${task.img}" loading="lazy">
            <div class="card-badge" style="background: ${task.tagColor};">${task.tagName}</div>
            ${task.priority === 'HIGH' ? '<div class="card-badge" style="right:8px; left:auto; background:#EF4444;">GẤP</div>' : ''}
          </div>
          <div class="card-body">
            <div class="card-title-row">
              <div class="check-circle ${isDone ? 'done' : ''}" onclick="event.stopPropagation(); toggleTask(${task.id})">
                ${isDone ? '✓' : ''}
              </div>
              <div class="card-title ${isDone ? 'done' : ''}">${task.title}</div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      updateWidget();
    }

    function toggleTask(id) {
      const task = currentTasks.find(t => t.id === id);
      if (task) {
        task.status = task.status === 'DONE' ? 'TODO' : 'DONE';
        renderTasks();
      }
    }

    function updateWidget() {
      const topPending = currentTasks.find(t => t.status !== 'DONE');
      const widgetBox = document.getElementById('widgetBox');
      if (!topPending) {
        document.getElementById('widgetTitle').innerText = 'Tất cả đã hoàn thành!';
        document.getElementById('widgetPriority').style.display = 'none';
        document.getElementById('widgetImg').src = 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400';
      } else {
        document.getElementById('widgetTitle').innerText = topPending.title;
        document.getElementById('widgetPriority').style.display = topPending.priority === 'HIGH' ? 'block' : 'none';
        document.getElementById('widgetImg').src = topPending.img;
      }
    }

    function completeTopWidgetTask() {
      const topPending = currentTasks.find(t => t.status !== 'DONE');
      if (topPending) {
        topPending.status = 'DONE';
        renderTasks();
      }
    }

    function filterTag(tag) {
      activeTag = tag;
      document.querySelectorAll('#tagsContainer .tag-chip').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      renderTasks();
    }

    function openCaptureModal() {
      document.getElementById('captureModal').classList.add('open');
      document.getElementById('taskInput').value = '';
    }

    function closeCaptureModal() {
      document.getElementById('captureModal').classList.remove('open');
    }

    function selectModalTag(tag) {
      currentModalTag = tag;
      document.querySelectorAll('#captureModal .tag-chip').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
    }

    function saveNewTask() {
      const input = document.getElementById('taskInput').value.trim();
      if (!input) return;

      const randomImages = [
        "https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=400",
        "https://images.unsplash.com/photo-1434030216411-0b793f4b4173?w=400"
      ];
      const randomImg = randomImages[Math.floor(Math.random() * randomImages.length)];

      const tagMap = {
        WORK: { name: 'Công việc', color: '#2563EB' },
        PERSONAL: { name: 'Cá nhân', color: '#059669' },
        SHOPPING: { name: 'Mua sắm', color: '#D97706' }
      };

      currentTasks.unshift({
        id: Date.now(),
        title: input,
        img: randomImg,
        tag: currentModalTag,
        tagName: tagMap[currentModalTag].name,
        tagColor: tagMap[currentModalTag].color,
        priority: "HIGH",
        status: "TODO"
      });

      closeCaptureModal();
      renderTasks();
    }

    function toggleView() {
      alert("Chuyển chế độ: Bạn có thể xem dạng Lưới ảnh hoặc Bảng Kanban 3 cột!");
    }

    // Init
    renderTasks();
  </script>
</body>
</html>
