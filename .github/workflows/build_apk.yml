name: Build Android APK (SnapTask)

on:
  push:
    branches: [ main, master, 'design/*', 'fix/*' ]
  workflow_dispatch:

jobs:
  build:
    name: Test, Lint & Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Generate Gradle 8.5 Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Run JVM Unit Tests
        run: ./gradlew testDebugUnitTest --no-configuration-cache --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-configuration-cache --stacktrace

      - name: Verify Lint Results (0 Fatal / 0 Error)
        shell: bash
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("app/build/reports/lint-results-debug.xml")
          if not report.exists():
              print(f"::error::Lint report not found: {report}")
              sys.exit(1)

          root = ET.parse(report).getroot()
          issues = root.findall("issue")
          counts = {"Fatal": 0, "Error": 0, "Warning": 0, "Information": 0}
          failing = []

          for issue in issues:
              sev = issue.attrib.get("severity", "Unknown")
              counts[sev] = counts.get(sev, 0) + 1
              if sev in ("Fatal", "Error"):
                  loc = issue.find("location")
                  where = ""
                  if loc is not None:
                      f = loc.attrib.get("file", "")
                      ln = loc.attrib.get("line", "")
                      where = f" ({f}:{ln})" if ln else (f" ({f})" if f else "")
                  failing.append(
                      f"[{sev}] {issue.attrib.get('id', '?')}: "
                      f"{issue.attrib.get('message', '')}{where}"
                  )

          print(
              f"Lint severity counts -> Fatal: {counts['Fatal']}, "
              f"Error: {counts['Error']}, Warning: {counts['Warning']}, "
              f"Information: {counts['Information']}"
          )
          for item in failing:
              print(f"::error::{item}")

          if counts["Fatal"] + counts["Error"] > 0:
              sys.exit(1)
          PY

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-configuration-cache --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-configuration-cache --stacktrace

      - name: Verify APK Sizes (Per-ABI Release < 12 MiB)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          MAX_PER_ABI_BYTES=12582912
          failed=0
          found_release_abi=0

          echo "=== Debug APKs ==="
          debug_apks=(app/build/outputs/apk/debug/*.apk)
          if [ ${#debug_apks[@]} -eq 0 ]; then
            echo "::error::No Debug APKs found under app/build/outputs/apk/debug/"
            failed=1
          else
            for apk in "${debug_apks[@]}"; do
              bytes=$(stat -c%s "$apk")
              mb=$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b / 1048576 }')
              echo "  $apk -> ${mb} MB (${bytes} bytes)"
            done
          fi

          echo "=== Release APKs ==="
          release_apks=(app/build/outputs/apk/release/*.apk)
          if [ ${#release_apks[@]} -eq 0 ]; then
            echo "::error::No Release APKs found under app/build/outputs/apk/release/"
            failed=1
          else
            for apk in "${release_apks[@]}"; do
              bytes=$(stat -c%s "$apk")
              mb=$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b / 1048576 }')
              echo "  $apk -> ${mb} MB (${bytes} bytes)"
              base=$(basename "$apk")
              if [[ "$base" == *armeabi-v7a* || "$base" == *arm64-v8a* ]]; then
                found_release_abi=1
                if [ "$bytes" -ge "$MAX_PER_ABI_BYTES" ]; then
                  echo "::error::Per-ABI Release APK $base is ${bytes} bytes (>= ${MAX_PER_ABI_BYTES} bytes / 12 MiB limit)"
                  failed=1
                fi
              fi
            done
          fi

          if [ "$found_release_abi" -eq 0 ]; then
            echo "::error::No per-ABI release APKs (*armeabi-v7a* or *arm64-v8a*) found under app/build/outputs/apk/release/"
            failed=1
          fi

          exit "$failed"

      - name: Upload Unit Test & Lint Reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: SnapTask-Reports
          if-no-files-found: ignore
          path: |
            app/build/reports/
            app/build/test-results/

      - name: Upload Debug APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: SnapTask-Debug-APK
          if-no-files-found: ignore
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: SnapTask-Release-APK
          if-no-files-found: ignore
          path: app/build/outputs/apk/release/*.apk
